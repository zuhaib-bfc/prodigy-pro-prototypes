<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Prodigy Pro: app design prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1218;--surface:#131D26;--ink:#EAF1F4;--mute:#93A4B1;--line:#25323D;--brand:#2BB3A3;--brand-ink:#04201C;--soft:#12302D;--lime:#C6E24A;--warn:#F0A64B;--shadow:0 20px 50px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0B1218;--surface:#131D26;--ink:#EAF1F4;--mute:#93A4B1;--line:#25323D;--brand:#2BB3A3;--brand-ink:#04201C;--soft:#12302D;--lime:#C6E24A;--warn:#F0A64B;--shadow:0 20px 50px rgba(0,0,0,.5)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.jump{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
@media (max-width:700px){.jump{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:100%;width:100%;padding:0 12px;scrollbar-width:none}.jump button{flex:none;white-space:nowrap}}
.jump button{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:12.5px;color:var(--mute)}
.jump button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.phone{width:100%;max-width:392px;height:min(780px,calc(100dvh - 70px));background:var(--surface);border-radius:34px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#scr{flex:1;overflow-y:auto;padding:18px 18px 8px}
nav{display:flex;border-top:1px solid var(--line);padding:6px 6px 8px;background:var(--surface)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--mute);border-radius:12px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--brand)}
h1{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:15px;margin:20px 0 8px;font-weight:700}
.mute{color:var(--mute)}.sm{font-size:12px}.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:18px}
.hero .mute{color:#A9B9C6}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--lime);border-radius:9px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:15px;text-align:center}
.btn.alt{background:var(--soft);color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:10px -18px 0;padding-left:18px;padding-right:18px}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:12.5px;color:var(--mute)}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sb{display:flex;align-items:center;gap:10px;height:46px;margin:12px 0 2px;padding:0 6px 0 15px;border-radius:99px;background:var(--bg);border:1.5px solid transparent;color:var(--mute);transition:border-color .15s,box-shadow .15s,background .15s}
.sb:focus-within{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px var(--soft);color:var(--brand)}
.sb>svg{flex:none;width:18px;height:18px}
.sb input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--ink)}
.sb input::placeholder{color:var(--mute);font-weight:500}
.sb .sbx{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--mute);display:grid;place-items:center;font-size:15px;line-height:1}
.sb .sbx[hidden]{display:none}
.sb .sbs{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;border:1px solid var(--line)}
.sb .sbs svg{width:17px;height:17px}
.fund{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.logo{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:800}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--bg);font-size:11px;font-weight:600;color:var(--mute);margin-right:4px}
.up{color:var(--brand);font-weight:700}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin:4px 0 14px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(10,31,54,.12)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:4px;font-size:46px;font-weight:800;letter-spacing:-.03em;margin:10px 0 2px}
.amt input{font:inherit;color:inherit;width:6.2ch;text-align:left;border:0;background:none;padding:0;min-width:0}
.sum{border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin:14px 0}
.sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{padding:8px 0;font-weight:700;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.alloc{display:flex;height:10px;border-radius:9px;overflow:hidden;margin:8px 0}
.disc{font-size:11px;color:var(--mute);margin:16px 0 6px}
.otp{display:flex;gap:8px;justify-content:center;margin:16px 0}
.otp span{width:42px;height:50px;border:1.5px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:800}
.check{width:72px;height:72px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:34px auto 14px;color:var(--brand)}
.tabs.scroll{overflow-x:auto;white-space:nowrap}
.pers{display:flex;gap:6px;margin-top:8px}.pers button{flex:1;padding:6px 0;border-radius:99px;font-weight:700;font-size:12px;color:var(--mute);background:var(--bg)}.pers button.on{background:var(--ink);color:var(--surface)}
.g4{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}.g4 b{text-align:right}.g4.gh{color:var(--mute);font-size:12px}.g4.gh b{font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta{position:sticky;bottom:-8px;display:flex;gap:10px;padding:12px 0 8px;margin-top:8px;background:linear-gradient(to bottom,transparent,var(--surface) 28%)}
.sev{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}.sev.h{background:rgba(180,83,9,.14);color:var(--warn)}.sev.l{background:var(--soft);color:var(--brand)}
.opt{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;font-weight:600}.opt.on{border-color:var(--brand);background:var(--soft)}
.warncard{border-color:var(--warn)}input[type=range]{width:100%;accent-color:var(--brand);margin-top:8px}
nav button{font-size:10.5px}
.phone{position:relative}.lg{flex:none}
.snap{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 8px}.snap::-webkit-scrollbar{display:none}
.gc{flex:none;width:200px;scroll-snap-align:start;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);background:var(--surface);padding:0;transition:transform .15s,border-color .15s}.gc.sel{border-color:var(--brand)}.gc:active,.btn:active,.opt:active{transform:scale(.97)}
.hrt{padding:4px;margin-top:4px;color:var(--mute);line-height:0}
.cl{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);display:none;pointer-events:none}
.ovl{position:absolute;inset:0;background:rgba(5,15,25,.5);display:flex;align-items:flex-end;z-index:5}.sh{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:8px 18px 22px;max-height:82%;overflow:auto}.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:12px;font-weight:600;font-size:13px;z-index:6;white-space:nowrap}.toast[hidden]{display:none}
.tg{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}.tg:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}.tg.on{background:var(--brand)}.tg.on:after{left:21px}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .25s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 0;border-bottom:1px solid var(--line);text-align:left}
.inp{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:inherit}
.btn[disabled]{cursor:not-allowed}a.btn{box-sizing:border-box}
.up{white-space:nowrap}
.rmx{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--warn);color:#fff;font-weight:800;line-height:1;z-index:2}
@media (prefers-reduced-motion:no-preference){.check{animation:pop .4s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}}}
@media (max-width:480px){body{padding:0;justify-content:flex-start}.phone{max-width:none;border-radius:0;border:0;box-shadow:none;height:calc(100dvh - 54px)}}
</style></head><body>
<div class="jump" id="jump"></div>
<div class="phone"><div id="scr"></div><nav id="nav"></nav><div id="ov"></div><div id="toast" class="toast" hidden></div></div>
<script>

edu:['#E3F2EF','<path d="M0 80Q50 50 100 72T210 60V96H0Z" fill="#BFE3DC"/><path d="M105 22L146 40L105 58L64 40Z" fill="#0A1F36"/><path d="M84 50v16q21 12 42 0V50L105 60Z" fill="#00897B"/><path d="M146 40v22" stroke="#C6E24A" stroke-width="3"/>'],

const G=[['edu','Child education',26,'₹6.4 L of ₹25 L by 2038','₹8,000'],['home','Dream home',12,'₹3.1 L of ₹25 L by 2034','₹12,000'],['retire','Retirement',9,'₹9.0 L of ₹1 Cr by 2050','₹10,000'],['travel','Europe trip',48,'₹1.4 L of ₹3 L by 2027','₹6,000']];

const HD=[['Aurora Flexi Cap',210400,'#00897B'],['Meridian Nifty 50',145900,'#0A1F36'],['Harbor Balanced',86300,'#C6E24A'],['Cove Liquid',43650,'#E07A5F']];

<div class="g2" style="margin-top:10px">${[['Volatility (std dev)','11.6%'],['Max fall, last 3 years','-18.4%'],['Beta vs market','0.94'],['Sharpe ratio','0.88'],['Diversification','7 of 10'],['Worst year (3Y)','-6.2%']].map(m=>`<div class="card"><div class="sm mute">${m[0]}</div><b class="num">${m[1]}</b></div>`).join('')}</div>
<h2>Your mix vs recommended mix</h2><div class="card">${['Equity','Debt','Cash'].map((n,i)=>`<div class="row sm" style="margin-top:${i?10:0}px"><span>${n}</span><span class="num"><b>${act[i]}%</b> <span class="mute">vs ${rec[i]}% suggested</span></span></div><div style="position:relative;height:7px;border-radius:6px;background:var(--line);margin-top:5px"><i style="display:block;height:100%;width:${act[i]}%;background:${act[i]>rec[i]+5?'var(--warn)':'var(--brand)'};border-radius:6px"></i><u style="position:absolute;top:-3px;left:${rec[i]}%;width:2px;height:13px;background:var(--ink)"></u></div>`).join('')}<p class="sm mute" style="margin:10px 0 0">The dark tick marks the suggested level. Equity is ${act[0]-rec[0]>0?(act[0]-rec[0])+' points above':'within'} the suggested level.</p></div>
<h2>Where risk is concentrated</h2>${[['Single fund','43% in Aurora Flexi Cap','High'],['Sector','27% in financials across funds','Medium'],['Stock overlap','38% of top 10 stocks repeat in two funds','Medium'],['Fund houses','Spread over 4 AMCs','Low']].map(r=>k(r[0]+`<div class="sm">${r[1]}</div>`,sv(r[2],r[2]=='Low'?'l':'h'))).join('')}

return `<h1>Portfolio</h1><div class="hero" style="margin-top:10px"><div class="sm mute">Current value</div><div style="font-size:30px;font-weight:800" class="num" id="pv">${hid?'₹ ••••••':inr(T)}</div><div class="row sm" style="margin-top:8px">${hid?'<span class="mute">Balances hidden</span>':`<span class="mute">Invested ${inr(inv)}</span><span style="color:var(--lime);font-weight:700">${gain>=0?'+':'-'}${inr(Math.abs(gain))} (${(gain/inv*100).toFixed(1)}%)</span>`}</div>${pend&&!hid?`<div class="sm mute" style="margin-top:6px">${inr(pend)} pending allotment</div>`:''}</div>
<div class="row" style="gap:10px;margin-top:10px"><div class="card" style="flex:1"><div class="sm mute">Absolute return</div><b class="up num">${hid?'••':(gain/inv*100).toFixed(1)+'%'}</b><div class="sm mute">since you started</div></div><div class="card" style="flex:1"><div class="sm mute">XIRR</div><b class="up num">${hid?'••':'15.2%'}</b><div class="sm mute">annualised, accounts for timing</div></div></div>${donut()}
<button class="card row" style="width:100%;margin-top:12px;text-align:left" onclick="go('risk')"><div><b>Portfolio risk score 74</b><div class="sm mute">Above your comfort band. See why</div></div><span class="up sm">Open</span></button>
<div class="tabs">${['Holdings','SIPs','Orders'].map(t=>`<button class="${S.ptab==t?'on':''}" onclick="S.ptab='${t}';render()">${t}${t=='Orders'?' ('+S.orders.length+')':t=='SIPs'?' ('+SIPS.length+')':''}</button>`).join('')}</div>${body}${DISC}`}
};
function setAmt(v){const n=parseInt(v.replace(/\D/g,''))||0;S.amt=n;const ok=n>=S.fund.min;document.getElementById('minmsg').style.color=ok?'':'var(--warn)';document.getElementById('minmsg').textContent=ok?'Minimum '+inr(S.fund.min):'Enter at least '+inr(S.fund.min);document.getElementById('go').style.opacity=ok?1:.45}
const fit=f=>NEED[f.r]<=S.prof.lvl;
const fitCard=f=>`<div class="card ${fit(f)?'':'warncard'}" style="margin:10px 0"><div class="row"><div><b>${fit(f)?'Fits your profile':'Higher risk than your profile'}</b><div class="sm mute">${LV[S.prof.lvl]} profile, fund risk is ${f.r.toLowerCase()}.${fit(f)?'':' Consider a smaller amount or a lower-risk fund.'}</div></div><button class="up sm" onclick="go('risk')">Details</button></div></div>`;
function pick(i){S.ans[S.q]=i+1;if(S.q<Q.length-1){S.q++;render()}else{const m=g=>{const a=Q.map((x,j)=>x.g==g?S.ans[j]:0).filter(Boolean);return Math.round(a.reduce((x,y)=>x+y,0)/a.length*20)};const t=m('t'),c=m('c');S.prof={t,c,lvl:lvOf(Math.round((t+c)/2))};go('risk')}}
function upd(){const d=S.drop,pv=tot(),l=Math.round(pv*.78*.94*d/100);document.getElementById('dv').textContent=d+'%';document.getElementById('stress').innerHTML=`<div class="row" style="margin-top:12px"><span class="mute">Estimated fall in value</span><b class="num" style="color:var(--warn)">-₹${l.toLocaleString('en-IN')}</b></div><div class="row" style="margin-top:6px"><span class="mute">Value after the fall</span><b class="num">₹${(pv-l).toLocaleString('en-IN')}</b></div><p class="sm mute" style="margin:8px 0 0">About ${(l/pv*100).toFixed(1)}% of your portfolio. Estimate uses your equity share and beta. Actual results can differ.</p>`}
function go(s,o){Object.assign(S,o||{});S.screen=s;S.otp=false;S.anim=s=='pf';closeSheet();render()}
function openFund(id){S.fund=F.find(f=>f.id==id);S.tab='Overview';go('fund')}
const NAV=[['home','Home','home'],['explore','Explore','explore'],['order','Invest','invest'],['pf','Portfolio','pf'],['more','More','more']];
const JUMP=[['home','Home'],['explore','Explore funds'],['fund','Fund detail'],['order','Order window'],['done','Order placed'],['pf','Portfolio'],['risk','Risk analysis'],['quiz','Risk quiz'],['goal','Goal detail'],['sips','SIPs & top-up'],['refer','Referral'],['onboard','Onboarding'],['profile','Profile'],['more','More'],['ins','Insurance'],['lamf','Loan on funds'],['prod','Add-on product']];
function render(){const active={fund:'explore',done:'order',risk:'more',quiz:'more',sips:'pf',goal:'home',refer:'more',profile:'more',onboard:'home',ins:'more',lamf:'more',prod:'more'}[S.screen]||S.screen;
document.getElementById('scr').innerHTML=V[S.screen]();
document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="${active==n[0]?'on':''}" onclick="go('${n[0]}')">${svg(n[2])}${n[1]}</button>`).join('');
document.getElementById('jump').innerHTML=JUMP.map(j=>`<button class="${S.screen==j[0]?'on':''}" onclick="go('${j[0]}')">${j[1]}</button>`).join('');
if(S.screen=='order'&&!S.otp)setAmt(String(S.amt));document.getElementById('nav').style.display=S.screen=='onboard'?'none':'';if(S.screen=='onboard')obUpd();if(S.screen=='risk')upd();if(S.screen=='lamf'&&!S.loan)lmUp();if(S.screen=='fund'&&S.tab=='Overview')calc();if(S.screen=='pf'&&S.anim){S.anim=false;cu()}}
render();
