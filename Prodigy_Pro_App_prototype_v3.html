<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prodigy Pro — App prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
:root{
  --brand:#000e7c;--brand-d:#060057;--brand-soft:#EEF0FF;--brand-ink:#fff;--brand-fg:#1A2A9C;
  --green:#08A35B;--green-soft:#E6F6EE;--red:#E0383E;--red-soft:#FDECEC;--amber:#C27803;--amber-soft:#FFF5E1;
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F5F6F8;--tint:#F3F4F7;--ink:#111318;--ink-2:#4A4E5A;--mute:#858995;--line:#ECEEF2;
  --shadow:0 1px 2px rgba(13,14,18,.04),0 10px 30px rgba(13,14,18,.06);
  --frame:#0D0E12;--desk:#E9EBF2;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#2a378b;--brand-d:#1c2988;--brand-soft:#1A2150;--brand-ink:#fff;--brand-fg:#A3B0FF;
  --green:#2FC27C;--green-soft:#0F2A1E;--red:#FF6369;--red-soft:#33171A;--amber:#F2B144;--amber-soft:#2E2412;
  --bg:#080B18;--surface:#10152B;--surface-2:#161C36;--tint:#1B2240;--ink:#F1F3FB;--ink-2:#C6CBE2;--mute:#8B91B0;--line:#242B4B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);--frame:#000;--desk:#04050C;color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#2a378b;--brand-d:#1c2988;--brand-soft:#1A2150;--brand-ink:#fff;--brand-fg:#A3B0FF;
  --green:#2FC27C;--green-soft:#0F2A1E;--red:#FF6369;--red-soft:#33171A;--amber:#F2B144;--amber-soft:#2E2412;
  --bg:#080B18;--surface:#10152B;--surface-2:#161C36;--tint:#1B2240;--ink:#F1F3FB;--ink-2:#C6CBE2;--mute:#8B91B0;--line:#242B4B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);--frame:#000;--desk:#04050C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:Outfit,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;gap:28px;padding:16px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand-fg);outline-offset:2px;border-radius:8px}
a{color:var(--brand-fg);text-decoration:none}
svg{display:block}
.i{width:20px;height:20px;flex:none}

/* desk + frame */
.map{width:270px;max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:13.5px;box-shadow:var(--shadow)}
.map h3{margin:0 0 2px;font-size:16px;font-weight:700}
.map .grp{margin-top:14px;font-weight:600;color:var(--mute);font-size:12.5px}
.map button.lk{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:8px;color:var(--ink-2)}
.map button.lk:hover{background:var(--tint);color:var(--ink)}
.map .tg{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:8px}
.phone{position:relative;width:390px;height:min(844px,100%);background:var(--bg);border-radius:46px;border:10px solid var(--frame);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(13,14,18,.25)}
.sbar{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 30px;font-weight:600;font-size:14px;background:var(--sbar,transparent);color:var(--sbar-ink,var(--ink));transition:background .2s}
.sbar i{font-style:normal;letter-spacing:2px;font-size:12px}
#view{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
@media (max-width:860px){.map{display:none}}
@media (max-width:520px){
  body{padding:0;height:100%}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .sbar{display:none}
}

/* screen scaffolding */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:in .28s cubic-bezier(.2,.8,.2,1)}
.scr.back{animation:inb .28s cubic-bezier(.2,.8,.2,1)}
.scr.fade{animation:fd .35s ease}
.scr.still{animation:none}
@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes inb{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hdr{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:60px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:2}
.hdr.blue{background:var(--surface);color:var(--ink)}
.hdr h1{flex:1;margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:hover{background:rgba(127,127,160,.12)}
.ib svg{width:22px;height:22px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:20px}
.foot{flex:none;padding:14px 20px 18px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px;position:relative;z-index:3}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--mute);padding:4px 0}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--brand-fg)}
.nav .ai{position:relative;top:-14px}
.nav .ai span.orb{width:52px;height:52px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 8px 24px rgba(13,14,18,.12)}
.nav .ai span.orb img{width:28px;height:28px}
.nav .ai span.orb svg{width:26px;height:26px}

/* type */
.t-xl{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.t-l{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.t-m{font-size:18px;font-weight:600;letter-spacing:-.01em}
.t-b{font-weight:600}
.t-s{font-size:13px}.t-xs{font-size:11.5px}
.mute{color:var(--mute)}.ink2{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--green)}.dn{color:var(--red)}.br{color:var(--brand-fg)}
h2.sec{font-size:18px;font-weight:600;margin:36px 0 14px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.01em}
h2.sec a,h2.sec button{font-size:13.5px;font-weight:500;color:var(--brand-fg)}
p{margin:0 0 8px}

/* building blocks */
.card{background:var(--surface);border-radius:20px;padding:20px;border:1px solid var(--line)}
.card+.card{margin-top:14px}
.card.flat{border:0}
.card.blue{background:var(--surface-2);color:var(--ink);border:0}
.card.soft{background:var(--surface-2);border:0}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.row.top{align-items:flex-start}
.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1;min-width:0}
.gap8{gap:8px}.gap12{gap:12px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{height:1px;background:var(--line);margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 8px;scroll-snap-type:x mandatory;scroll-padding:0 20px}
.hs::-webkit-scrollbar{display:none}
.hs>*{flex:none;scroll-snap-align:start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;background:var(--brand);color:#fff;font-weight:600;font-size:16px;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.btn.line{background:transparent;color:var(--brand-fg);border:1.5px solid var(--brand-fg)}
.btn.soft{background:var(--tint);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:14px}
.btn.xs{height:30px;padding:0 10px;border-radius:9px;font-size:12.5px}
.btn.white{background:#fff;color:var(--brand)}
.btn.danger{background:var(--red)}
.btn svg{width:18px;height:18px}

.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.g{background:var(--green-soft);color:var(--green)}.tag.r{background:var(--red-soft);color:var(--red)}.tag.a{background:var(--amber-soft);color:var(--amber)}.tag.b{background:var(--brand-soft);color:var(--brand-fg)}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{flex:1;height:38px;border-radius:11px;font-weight:500;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs{display:flex;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 10px;font-weight:500;font-size:14.5px;color:var(--mute);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}

.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:13px;color:var(--mute);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.inp{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;width:100%;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--brand-fg)}
.inp.err{border-color:var(--red)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 22px,calc(100% - 13px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inp.pre{background:var(--surface-2)}
.err-t{color:var(--red);font-size:12.5px}
.kra{font-size:10.5px;font-weight:600;color:var(--green);background:var(--green-soft);padding:1px 6px;border-radius:5px}

.li{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .ic{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--ink-2);display:grid;place-items:center;flex:none}
.li .ic svg{width:21px;height:21px}
.chev{color:var(--mute);flex:none}
.chev svg{width:18px;height:18px}

.amc{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;letter-spacing:-.02em}
.amc.sm{width:34px;height:34px;border-radius:10px;font-size:12px}

.tgl{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.tgl.on{background:var(--brand)}.tgl.on::after{transform:translateX(18px)}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.stack>i{display:block;height:100%}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

/* sheet + toast */
.ov{position:absolute;inset:0;background:rgba(5,8,25,.45);z-index:40;display:flex;align-items:flex-end;animation:fd .2s}
.sheet{background:var(--surface);width:100%;max-height:88%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:10px auto 0;flex:none}
.sheet .sh{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:center;flex:none}
.sheet .sh h3{margin:0;font-size:19px;font-weight:600}
.sheet .sbody{padding:6px 18px 18px;overflow-y:auto}
.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:60;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:14px;font-size:14px;animation:up .25s}

/* splash / onboarding */
.splash{background:#fff;color:#0D0E12;align-items:center;justify-content:center}
.splash .lg{width:62%;max-width:240px;animation:pop .9s cubic-bezier(.2,.9,.25,1.2)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.trust{position:absolute;bottom:42px;left:0;right:0;text-align:center}
.trust .lbl{font-size:12.5px;color:#6C7080;margin-bottom:10px}
.wm{display:flex;justify-content:center;gap:10px}
.wm span{font-weight:700;font-size:13.5px;letter-spacing:.04em;padding:6px 12px;border-radius:9px;border:1px solid #E5E7EF;color:#3A3D48;background:#F7F8FB}
.otp{display:flex;gap:12px;justify-content:center}
.otp input{width:62px;height:66px;text-align:center;font-size:26px;font-weight:600;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);outline:none}
.otp input:focus{border-color:var(--brand-fg)}
.otp.six input{width:44px;height:54px;font-size:22px;border-radius:12px}

/* chat */
.chat{padding:20px 16px 32px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;animation:msg .25s ease}
@keyframes msg{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.msg.bot{background:var(--surface-2);border:0;border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--ink);color:var(--surface);border-bottom-right-radius:6px;align-self:flex-end}
.msg.wide{max-width:100%;width:100%}
.botrow{display:flex;gap:8px;align-items:flex-end}
.av{width:30px;height:30px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.av img{width:22px;height:22px}
.av.ghost{visibility:hidden}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.reply{margin-top:8px;align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;animation:msg .3s ease;box-shadow:var(--shadow)}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);margin-top:8px;font-size:15px;background:var(--surface)}
.opt:first-child{margin-top:0}
.opt:hover{border-color:var(--ink);background:var(--surface-2)}
.opt b{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:var(--mute);flex:none}
.qprog{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;margin-bottom:2px}
.qprog .bar{flex:1;height:5px}

/* AI motif: the blue→green line from the logo */
.ailine{height:3px;background:linear-gradient(90deg,var(--brand),#08A35B,var(--brand));background-size:200% 100%;animation:flow 2.2s linear infinite}
@keyframes flow{from{background-position:0 0}to{background-position:-200% 0}}
.orbit{width:120px;height:120px;border-radius:50%;position:relative;display:grid;place-items:center}
.orbit::before,.orbit::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--brand-fg);border-right-color:var(--brand-fg);animation:spin 1.4s linear infinite}
.orbit::after{inset:12px;border-top-color:#08A35B;border-right-color:transparent;border-left-color:#08A35B;animation-duration:2s;animation-direction:reverse}
.orbit img{width:54px;height:54px}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{flex:none;background:var(--surface-2);color:var(--ink);padding:10px 16px 0;position:relative;overflow:hidden}
.banner .ttl{font-size:13.5px;font-weight:500;min-height:20px}
.banner .meta{font-size:11.5px;opacity:.7;display:flex;justify-content:space-between;margin:2px 0 8px}
.steps{display:flex;gap:4px;padding:12px 16px 0;background:var(--surface)}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--brand)}
.steps i.done{background:var(--green)}
.check{width:84px;height:84px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto;animation:pop .5s cubic-bezier(.2,.9,.25,1.4)}
.check svg{width:44px;height:44px;color:#fff}

.hero{background:var(--surface);color:var(--ink);padding:8px 20px 4px}
.eyeb{color:var(--mute);font-size:13px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:12.5px;color:var(--mute)}
.stat .v{font-weight:600;font-variant-numeric:tabular-nums}
.svc{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:12.5px;font-weight:500;padding:6px 2px;position:relative}
.svc .si{width:54px;height:54px;border-radius:18px;background:var(--tint);color:var(--ink-2);display:grid;place-items:center}
.svc .si svg{width:24px;height:24px}
.svc .soon{position:absolute;top:0;right:4px;font-size:9.5px;background:var(--amber-soft);color:var(--amber);padding:1px 5px;border-radius:5px;font-weight:600}
.risk-m{display:flex;gap:3px}
.risk-m i{flex:1;height:8px;border-radius:3px;opacity:.25}
.risk-m i.on{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.vid{width:220px;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.vid .th{height:120px;display:grid;place-items:center;position:relative}
.vid .th .pl{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#111318;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.vid .th .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 6px;border-radius:5px}
.basket{width:260px;border-radius:20px;padding:18px;color:var(--ink);background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.goalc{width:172px;border-radius:20px;padding:16px;background:var(--surface);border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:12px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mute)}
.kv span:last-child{font-weight:500;text-align:right}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-weight:500;color:var(--mute);text-align:right;padding:8px 4px;font-size:12px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:10px 4px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
.sl{width:100%;accent-color:var(--brand)}
.empty{text-align:center;padding:30px 20px}
.pill-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.note{font-size:12px;color:var(--mute);line-height:1.5}
.sig{width:100%;height:150px;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface-2);touch-action:none}
.cam{width:200px;height:200px;border-radius:50%;margin:10px auto;border:3px solid var(--brand);display:grid;place-items:center;background:var(--surface-2);position:relative;overflow:hidden}
.cam::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--green),transparent);animation:scan 2s ease-in-out infinite}
@keyframes scan{0%,100%{top:10%}50%{top:88%}}
.aa{--aa:#5A2FCB}
.aa .hdr{background:#fff;color:#1b1b1f}
.gauge-t{font-size:40px;font-weight:700;letter-spacing:-.03em}

/* ===================== Friendly refresh (same colour palette) ===================== */
:root{
  --bg:#F5F7FC;--surface-2:#EEF1F8;--tint:#ECEFF7;--line:#E6E9F2;
  --shadow:0 1px 2px rgba(0,14,124,.04),0 8px 24px rgba(17,19,24,.06);
  --shadow-lg:0 2px 6px rgba(0,14,124,.06),0 18px 40px rgba(17,19,24,.10);
  --brand-glow:0 8px 20px rgba(0,14,124,.28);
  --hero:linear-gradient(135deg,#000f81 0%,#141f72 55%,#273590 100%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45);--brand-glow:0 8px 20px rgba(42,55,139,.45);--hero:linear-gradient(135deg,#0A178A 0%,#16217A 55%,#2A3896 100%);--hero-shadow:0 16px 36px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45);--brand-glow:0 8px 20px rgba(42,55,139,.45);--hero:linear-gradient(135deg,#0A178A 0%,#16217A 55%,#2A3896 100%);--hero-shadow:0 16px 36px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.06)}

/* softer chrome */
.hdr{background:var(--bg);border-bottom:0}
.hdr h1{font-weight:700}
.ib{border-radius:14px;transition:background .15s}
.foot{border-top:0;box-shadow:0 -6px 20px rgba(17,19,24,.05);border-radius:24px 24px 0 0}
.nav{border-top:0;box-shadow:0 -6px 24px rgba(17,19,24,.06);border-radius:24px 24px 0 0;padding:8px 6px 10px}
.nav button{gap:3px;transition:color .15s}
.nav button svg{padding:3px 12px;width:48px;height:30px;border-radius:999px;transition:background .2s}
.nav button.on{font-weight:600}
.nav button.on svg{background:var(--brand-soft)}
.nav .ai span.orb{border-radius:50%;border:0;box-shadow:var(--brand-glow),0 0 0 4px var(--bg)}

/* type */
.t-xl{letter-spacing:-.035em}
h2.sec{font-size:19px;font-weight:700;margin:32px 0 14px}
h2.sec a,h2.sec button{font-weight:600;padding:4px 10px;border-radius:999px;background:var(--brand-soft)}

/* cards: lift instead of outline */
.card{border:0;border-radius:24px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
button.card:hover,.goalc:hover,.basket:hover,.vid:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card.soft,.card.blue{background:var(--brand-soft);box-shadow:none}
.goalc,.basket,.vid{border:0;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.goalc{border-radius:22px}
.goalc[style*="dashed"]{border:2px dashed color-mix(in srgb,var(--brand-fg) 35%,transparent);box-shadow:none;background:transparent}
.basket{border-radius:24px}
.basket::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--brand-soft);opacity:.7;z-index:0}
.basket>*{position:relative;z-index:1}
.vid{border-radius:20px}

/* buttons */
.btn{border-radius:999px;box-shadow:var(--brand-glow);transition:transform .1s,box-shadow .15s,background .15s}
.btn:hover{background:var(--brand-d)}
.btn.line,.btn.soft,.btn.ghost,.btn.white{box-shadow:none}
.btn.line:hover{background:var(--brand-soft)}
.btn.soft{background:var(--brand-soft);color:var(--brand-fg)}
.btn.soft:hover{background:color-mix(in srgb,var(--brand) 14%,var(--surface))}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{box-shadow:0 8px 20px rgba(224,56,62,.25)}
.btn:disabled{box-shadow:none}
.btn.sm{border-radius:999px}.btn.xs{border-radius:999px;padding:0 12px}

/* chips, tabs, segmented */
.chip{border-radius:999px;transition:all .15s}
.chip:hover{border-color:var(--brand-fg);color:var(--brand-fg)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(0,14,124,.22)}
.tabs{background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button.on{color:var(--brand-fg);border-color:var(--brand-fg);font-weight:600}
.seg{border:0;background:var(--tint);border-radius:999px;padding:4px}
.seg button{border-radius:999px}
.seg button.on{color:var(--brand-fg);font-weight:600;box-shadow:0 2px 8px rgba(17,19,24,.08)}
.tag{border-radius:999px;padding:3px 9px}

/* inputs */
.inp{border-radius:16px;background:var(--surface);border-color:var(--line)}
.inp:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}
.otp input{border-radius:18px}
.otp input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}

/* list rows + icons: a little colour */
.li .ic{background:var(--brand-soft);color:var(--brand-fg);border-radius:14px}
.svc .si{border-radius:20px;background:var(--brand-soft);color:var(--brand-fg);transition:transform .15s}
.svc:hover .si{transform:translateY(-2px) scale(1.04)}
.grid4 .svc:nth-child(8n+2) .si,.grid4 .svc:nth-child(8n+7) .si,.grid3 .svc:nth-child(3n+2) .si{background:var(--green-soft);color:var(--green)}
.grid4 .svc:nth-child(8n+3) .si,.grid4 .svc:nth-child(8n+5) .si,.grid4 .svc:nth-child(8n) .si,.grid3 .svc:nth-child(3n) .si{background:var(--amber-soft);color:var(--amber)}
.hello{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .soon{border-radius:999px;padding:1px 6px}
.amc{border-radius:14px}
.empty .pill-ic{background:var(--brand-soft)!important;color:var(--brand-fg)!important;box-shadow:0 0 0 10px color-mix(in srgb,var(--brand) 6%,transparent)}
.empty .t-m{font-size:20px;font-weight:700}

/* sheet, toast */
.ov{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{border-radius:30px 30px 0 0}
.sheet .grab{width:44px;height:5px;background:var(--tint)}
.sheet .sh h3{font-weight:700}
.toast{border-radius:999px;text-align:center;box-shadow:var(--shadow-lg)}

/* chat: brand bubbles */
.msg{border-radius:20px}
.msg.bot{background:var(--surface);box-shadow:var(--shadow)}
.msg.me{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(0,14,124,.22)}
.av{border-radius:50%}
.reply{border:0;border-radius:24px;box-shadow:var(--shadow-lg)}
.opt{border-radius:16px;transition:all .15s}
.opt:hover{border-color:var(--brand-fg);background:var(--brand-soft)}
.opt:hover b{background:var(--brand);color:#fff}

/* progress */
.bar{border:0;background:var(--tint)}
.bar>i{background:linear-gradient(90deg,var(--brand),#4A61FF)}
.steps i{height:5px}

/* home hero */
.heroCard{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:28px;padding:22px 20px;box-shadow:var(--hero-shadow,0 16px 36px rgba(0,14,124,.28))}
.heroCard::before,.heroCard::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.heroCard::before{width:220px;height:220px;right:-70px;top:-90px}
.heroCard::after{width:140px;height:140px;right:40px;bottom:-80px;background:rgba(8,163,91,.22)}
.heroCard>*{position:relative;z-index:1}
.heroCard .mute,.heroCard .k,.heroCard .ink2{color:rgba(255,255,255,.78)!important}
.heroCard .up{color:#9BF2C6}.heroCard .dn{color:#FFC2C4}
.heroCard .stat .v{color:#fff}
.heroCard .ib{color:#fff;background:rgba(255,255,255,.14)}
.heroCard .ib:hover{background:rgba(255,255,255,.24)}
.heroCard .chg{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px}
.heroCard .grid3{background:rgba(255,255,255,.10);border-radius:18px;padding:12px 14px;gap:6px}
.heroCard .btn{background:#fff;color:var(--brand);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.heroCard .btn.soft{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.heroCard .btn:hover{background:#F0F2FF}.heroCard .btn.soft:hover{background:rgba(255,255,255,.26)}
.hi-wave{display:inline-block;transform-origin:70% 70%;animation:wave 1.8s ease-in-out .6s 1}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.aiCard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--green);transition:transform .15s,box-shadow .15s}
.aiCard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.aiCard .pill-ic{background:var(--brand-soft)!important}

/* prototype side map */
.map{border:0;border-radius:24px}
.map button.lk{border-radius:10px}

/* ---------- interactive USP walkthrough ---------- */
.wk-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:34px;border-radius:999px;font-size:12px;font-weight:600;color:var(--mute);background:var(--tint);transition:all .2s}
.wk-tab svg{width:15px;height:15px}
.wk-tab.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(0,14,124,.25)}
.wk-card{width:100%;background:var(--surface);border-radius:26px;padding:16px;box-shadow:var(--shadow-lg);animation:wkIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes wkIn{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.wk-title{animation:wkIn .4s .05s both}
.wk-pulse{animation:wkPulse 1.8s ease-in-out infinite}
@keyframes wkPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,14,124,.35),var(--brand-glow)}50%{box-shadow:0 0 0 10px rgba(0,14,124,0),var(--brand-glow)}}
.bank-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface-2);margin-top:8px;transition:all .35s}
.bank-row.on{background:var(--green-soft)}
.bank-row.mini,.ins.mini{padding-top:6px;padding-bottom:6px;margin-top:5px}
.bank-row.mini .pill-ic{width:26px;height:26px}.bank-row.mini .pill-ic svg{width:15px;height:15px}
.bank-row.mini .t-xs.mute{display:none}
.bk-st svg{width:14px;height:14px}
.ins{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-top:8px;border-radius:16px;background:var(--brand-soft);transition:all .3s}
.ins.in{animation:msg .3s ease}
.ins-ic{width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--brand-fg);display:grid;place-items:center;flex:none}
.ins-ic svg{width:16px;height:16px}
.ins.mini .ins-ic{width:22px;height:22px}.ins.mini .ins-ic svg{width:13px;height:13px}.ins.mini .t-s{font-size:12.5px}
.plan-pop{margin-top:12px;padding:14px;border-radius:20px;border:1.5px solid color-mix(in srgb,var(--brand) 25%,transparent);background:var(--surface);animation:pop .45s cubic-bezier(.2,.9,.25,1.3)}
.plan-pop .stack i{flex:0 0 33%}
.wk-stat{background:var(--surface-2);border-radius:18px;padding:10px 6px;text-align:center}
.wk-stat .t-m{font-size:16px;white-space:nowrap}
.cmp-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;margin-top:6px;animation:wkRow .35s both cubic-bezier(.2,.8,.2,1)}
@keyframes wkRow{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
.cmp-row.bad{background:var(--surface-2);color:var(--ink-2)}
.cmp-row.good{background:var(--green-soft);color:var(--ink)}
.cmp-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.cmp-ic svg{width:14px;height:14px;stroke-width:2.6}
.bad .cmp-ic{background:var(--mute)}.good .cmp-ic{background:var(--green)}
#cmpSeg button{display:flex;align-items:center;justify-content:center;gap:5px}
#cmpSeg button svg{width:15px;height:15px}
.fam-av{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;border:2px solid var(--surface)}
.fam-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.fam-row:last-child{border-bottom:0}
.fam-row.pop{animation:pop .45s cubic-bezier(.2,.9,.25,1.3)}
.add-chip{border-style:dashed;color:var(--brand-fg);border-color:color-mix(in srgb,var(--brand) 40%,transparent);height:32px;font-size:12.5px}
.add-chip svg{width:14px;height:14px}
.fam-done{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:14px;background:var(--green-soft);color:var(--green);font-weight:600;font-size:13.5px;animation:pop .5s cubic-bezier(.2,.9,.25,1.4)}
.fam-done svg{width:16px;height:16px}

/* =================== merged features + motion =================== */
/* bell badge */
.bellb{position:relative}
.bellb b{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg);animation:pop .4s cubic-bezier(.2,.9,.25,1.4)}
/* hero period pills + sparkline */
.heroCard .hp{flex:1;height:30px;border-radius:999px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8);background:rgba(255,255,255,.10);transition:all .2s}
.heroCard .hp.on{background:#fff;color:var(--brand)}
.spark{overflow:visible}
.spark .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) .15s forwards}
.spark .pulse-dot{transform-box:fill-box;transform-origin:center;animation:dotp 2s ease-in-out 1.2s infinite}
@keyframes dotp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.6)}}
.pf-split{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(255,255,255,.10);border-radius:18px;padding:12px 14px}
.pf-split>div{display:flex;flex-direction:column;gap:2px}
.pf-split .k{font-size:12px;color:rgba(255,255,255,.78)}
.pf-split b{color:#fff;font-size:15px}
.heroCard .pf-split b.up{color:#9BF2C6}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.qa i{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;background:var(--surface);color:var(--brand-fg);box-shadow:var(--shadow);transition:transform .15s}
.qa i.q1{color:var(--green)}.qa i.q2{color:var(--amber)}.qa i.q3{color:#00A3C4}
.qa i svg{width:24px;height:24px}
.qa button:hover i{transform:translateY(-2px)}
.qa button:active i,.svc:active .si,.chip:active,.hp:active,.gart:active,.nd:active{transform:scale(.93)}
/* for-you nudges */
.nd{flex:none;width:236px;border-radius:22px;padding:14px;position:relative;background:var(--surface);box-shadow:var(--shadow);transition:transform .25s,opacity .25s}
.nd.bye{transform:scale(.85) translateY(10px);opacity:0}
.nd .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.nd .x svg{width:15px;height:15px}.nd .x:hover{background:var(--tint)}
.nd-ic{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--brand-soft);color:var(--brand-fg);font-weight:700;font-size:13px;flex:none}
.nd-ic svg{width:18px;height:18px}
.nd.t-g .nd-ic{background:var(--green-soft);color:var(--green)}.nd.t-a .nd-ic{background:var(--amber-soft);color:var(--amber)}
.nd .btn svg{width:14px;height:14px}
/* illustrated cards */
.gart{flex:none;width:168px;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);text-align:left;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.gart:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.gart .art{display:block}
.gart.add{width:110px;align-items:center;justify-content:center;gap:6px;color:var(--brand-fg);background:transparent;box-shadow:none;border:2px dashed color-mix(in srgb,var(--brand-fg) 35%,transparent)}
.art-wrap,.goal-art{border-radius:24px;overflow:hidden;line-height:0}
.goal-art{margin:12px 20px 0;border-radius:22px}
.refer-card{background:linear-gradient(120deg,var(--surface) 55%,var(--green-soft))}
/* portfolio */
.ret{display:flex;flex-direction:column;gap:2px;padding:16px;margin:0!important}
.ret .t-l{font-size:24px}
.grid2 .card+.card{margin-top:0}
/* consistent gap between stacked card-like blocks (zero specificity: explicit mt* classes still win) */
:where(.card,.heroCard,.aiCard,.grid2,.grid3,.hs)+:where(.card,.heroCard,.aiCard){margin-top:14px}
.hs>*{margin-top:0}
.rmeter{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--green),#E3C11B,var(--amber),var(--red))}
.rmeter u{position:absolute;top:-3px;bottom:-3px;border:2px solid var(--ink);border-radius:6px;opacity:.35}
.rmeter i{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.2);animation:slideKnob .9s cubic-bezier(.2,.8,.2,1) both .2s}
@keyframes slideKnob{from{left:0}}
.gbar{height:5px;border-radius:99px;background:var(--tint);overflow:hidden;max-width:160px}
.gbar i{display:block;height:100%;border-radius:99px;animation:growW .9s cubic-bezier(.2,.8,.2,1) both .2s}
.li.hold{align-items:center}
.wl-sum{width:100%;text-align:left;display:block}
.wl-t{flex:none;width:136px;border-radius:20px;padding:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .15s,box-shadow .15s}
.wl-t:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.wl-t .pill-ic{width:38px;height:38px;border-radius:12px;margin-bottom:8px}
.wl-t .pill-ic svg{width:20px;height:20px}
.wl-t.add{width:112px;align-items:center;justify-content:center;gap:6px;color:var(--brand-fg);background:transparent;box-shadow:none;border:2px dashed color-mix(in srgb,var(--brand-fg) 35%,transparent)}
.ord-eta{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--amber-soft);color:var(--amber)}
.ord-eta .t-s{color:var(--ink)}
.otl{display:flex;flex-direction:column}
.otl-i{display:flex;gap:12px;position:relative;padding-bottom:18px}
.otl-i:last-child{padding-bottom:0}
.otl-i::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.otl-i:last-child::before{display:none}
.otl-i.done::before{background:var(--green)}
.otl-d{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:#fff}
.otl-d svg{width:14px;height:14px;stroke-width:3}
.otl-i.done .otl-d{background:var(--green);border-color:var(--green)}
.otl-i.now .otl-d{border-color:var(--brand-fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-fg) 18%,transparent)}
.otl-i.now .otl-d::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand-fg);animation:dotp 1.6s ease-in-out infinite}
.otl-i:not(.done):not(.now) b{color:var(--mute);font-weight:500}
.sipmore{width:30px;height:30px;border-radius:50%;margin-left:auto;background:var(--brand-soft);color:var(--brand-fg)}
.sipmore svg{width:18px;height:18px}
.osteps{display:flex;gap:4px}
.osteps span{flex:1;display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--mute)}
.osteps i{height:4px;border-radius:9px;background:var(--tint)}
.osteps .on{color:var(--ink-2)}.osteps .on i{background:var(--green);animation:growW .6s both}
.osteps span:nth-child(2) i{animation-delay:.15s}.osteps span:nth-child(3) i{animation-delay:.3s}
/* risk */
.rsteps{display:flex;gap:5px}
.rsteps i{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.18)}
.rsteps i.on{background:#9BF2C6;animation:pop .45s cubic-bezier(.2,.9,.25,1.4) both}
.mixbar{position:relative;height:8px;border-radius:99px;background:var(--tint)}
.mixbar i{display:block;height:100%;border-radius:99px;animation:growW .9s cubic-bezier(.2,.8,.2,1) both .1s}
.mixbar u{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--ink)}
input.sl{-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;background:var(--tint);outline:none}
input.sl::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--brand);border:4px solid var(--surface);box-shadow:0 2px 8px rgba(0,14,124,.35);cursor:grab}
input.sl::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--brand);border:4px solid var(--surface)}
.tl{display:flex;gap:12px;align-items:center;padding:8px 0}
/* NAV scrubbing */
.scrub{position:relative;touch-action:pan-y;cursor:crosshair}
.sc-line{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink);opacity:.5;display:none;pointer-events:none}
.sc-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);display:none;background:var(--ink);color:var(--surface);padding:5px 10px;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none;z-index:2;text-align:center}
.sc-tip b{display:block;font-size:13px}.sc-tip span{opacity:.75;font-size:11px}
/* slide to confirm */
.slide{position:relative;flex:1;height:58px;border-radius:999px;background:var(--brand-soft);overflow:hidden;user-select:none;-webkit-user-select:none;--p:0}
.slide .sl-fill{position:absolute;inset:0;background:var(--brand);transform-origin:left;transform:scaleX(calc(var(--p) * .9 + .1));opacity:calc(var(--p) * .9);border-radius:inherit}
.slide.drag .sl-fill,.slide.drag .sl-k{transition:none}
.slide .sl-t{position:absolute;inset:0;display:grid;place-items:center;padding-left:48px;font-weight:600;font-size:14.5px;color:var(--brand-fg);background:linear-gradient(90deg,var(--brand-fg) 0%,var(--brand-fg) 40%,#8DA0FF 50%,var(--brand-fg) 60%,var(--brand-fg) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2.4s linear infinite;opacity:calc(1 - var(--p))}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.slide .sl-k{position:absolute;left:4px;top:4px;width:50px;height:50px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:var(--brand-glow);cursor:grab;transition:transform .3s cubic-bezier(.2,.8,.2,1);touch-action:none}
.slide .sl-k svg{width:22px;height:22px}
.slide.ok .sl-k{background:var(--green)}
/* confetti */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:70}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),860px) rotate(var(--r));opacity:.2}}
/* entrance motion */
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.slidein{animation:slidein .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}}
path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.4,0,.2,1) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.scr:not(.still) .body svg path[fill^="url"]{animation:fd 1.2s ease both}
.scr:not(.still) .body svg circle[stroke-dasharray]{animation:arc 1.1s cubic-bezier(.2,.8,.2,1) both .1s}
@keyframes arc{from{stroke-dasharray:0 1000}}
.scr:not(.still) .bar>i,.scr:not(.still) .stack>i{animation:growW 1s cubic-bezier(.2,.8,.2,1) both .15s}
@keyframes growW{from{width:0}}
.nav button.on svg{animation:navpop .35s cubic-bezier(.2,.9,.25,1.4)}
@keyframes navpop{0%{transform:scale(.8)}100%{transform:none}}
.li:active{background:var(--tint)}
.tabs button{transition:color .2s,border-color .2s}
@media (prefers-reduced-motion:reduce){.spark .ln,path.draw{stroke-dasharray:none;stroke-dashoffset:0;animation:none}.slide .sl-t{animation:none}}

/* =================== chart kit =================== */
:root{--a-hy:#C25FC0;--c1:#3D4FD8;--c2:#07894C;--c3:#8A4FD6;--c4:#C98A0E;--c5:#0094B8;--c6:#D9573A;--cn:#9AA0B4;--c1-soft:#C5CBF5;--ch-grid:#E9ECF3;--ch-ax:#7C8191}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#6275F5;--c2:#16A266;--c3:#9468E2;--c4:#BB8418;--c5:#1798B8;--c6:#DC6440;--cn:#6B7080;--c1-soft:#2E376F;--ch-grid:#20274A;--ch-ax:#8B91B0}}
:root[data-theme="dark"]{--c1:#6275F5;--c2:#16A266;--c3:#9468E2;--c4:#BB8418;--c5:#1798B8;--c6:#DC6440;--cn:#6B7080;--c1-soft:#2E376F;--ch-grid:#20274A;--ch-ax:#8B91B0}

.ch{position:relative;outline:none;-webkit-tap-highlight-color:transparent}
.ch:focus-visible .ch-plot{box-shadow:0 0 0 2px var(--c1);border-radius:8px}
.ch-plot{position:relative;padding-right:46px}
.ch.nog .ch-plot{padding-right:0}
.ch-in{position:relative;height:100%;touch-action:pan-y;cursor:crosshair}
.ch-svg{display:block;width:100%;height:100%;overflow:visible}
.ch-svg .gl{stroke:var(--ch-grid);stroke-width:1}
.ch-svg .g0{stroke:var(--ch-ax);stroke-width:1;stroke-opacity:.6}
.ch-y{position:absolute;right:-46px;width:42px;transform:translateY(-50%);font-size:10.5px;color:var(--ch-ax);font-variant-numeric:tabular-nums;text-align:right;line-height:1;pointer-events:none}
.ch-y:first-of-type{transform:translateY(-100%)}
.ch-endv{position:absolute;right:-46px;transform:translateY(-50%);min-width:40px;padding:3px 6px;border-radius:6px;background:var(--c);color:#fff;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1;pointer-events:none;z-index:1}
.ch.nog .ch-endv{display:none}
.ch-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--surface);pointer-events:none;z-index:2}
.ch-dot.end::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:var(--c);opacity:.25;animation:chPulse 2.2s ease-out 1.2s infinite}
@keyframes chPulse{0%{transform:scale(.6);opacity:.35}100%{transform:scale(1.8);opacity:0}}
.ch.hov .ch-dot.end,.ch.hov .ch-endv{opacity:.35;transition:opacity .15s}
.ch-x{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--ch-ax);opacity:.7;display:none;pointer-events:none}
.ch-tip{position:absolute;top:4px;display:none;min-width:116px;padding:8px 10px;border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(17,19,24,.16);border:1px solid var(--line);font-size:12px;pointer-events:none;z-index:5;white-space:nowrap}
.ch-tip .th{font-size:11px;color:var(--mute);margin-bottom:4px}
.ch-tip .tr{display:flex;align-items:center;gap:7px;line-height:1.5}
.ch-tip .tr i{width:12px;height:2px;border-radius:2px;background:var(--c);flex:none}
.ch-tip .tr i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 5px)}
.ch-tip .tr i.bar{width:9px;height:9px;border-radius:2px}
.ch-tip .tr b{font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.ch-tip .tr span{color:var(--mute);font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.ch-xl,.cb-xl{display:flex;justify-content:space-between;margin-top:6px;padding-right:46px;font-size:10.5px;color:var(--ch-ax);font-variant-numeric:tabular-nums}
.ch-lg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.ch-lg span{display:inline-flex;align-items:center;gap:6px}
.ch-lg i{width:14px;height:2px;border-radius:2px;background:var(--c)}
.ch-lg i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.ch-lg i.bar{width:10px;height:10px;border-radius:3px}
.ch-tb{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--mute);padding:3px 8px;border-radius:999px}
.ch-tb:hover{background:var(--tint);color:var(--ink)}
.ch-tb svg{width:13px;height:13px}
.ch-lg.one{margin-top:6px}
.ch-t th,.ch-t td{font-size:12.5px}
/* draw-in: clip reveal (robust with non-scaling strokes) */
.scr:not(.still) .ch-svg{animation:chReveal 1.1s cubic-bezier(.4,0,.2,1) both .1s}
@keyframes chReveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ch path.draw{stroke-dasharray:none!important;stroke-dashoffset:0!important;animation:none!important}
.ch path.ln[stroke-dasharray]{stroke-dasharray:4 4!important}
.scr:not(.still) .ch-endv,.scr:not(.still) .ch-dot.end{animation:fd .4s ease both 1.1s}
/* hero sparkline skin */
.spk .ch-svg .ln{stroke:#fff}
.spk .ch-dot{box-shadow:0 0 0 2px rgba(0,15,129,.9)}
.spk .ch-x{border-color:rgba(255,255,255,.6)}
.spk .ch-tip{background:#fff;color:#111318;border:0}
.spk .ch-tip .th,.spk .ch-tip .tr span{color:#5c6170}
.spk-base{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.62);margin-top:4px}
/* full chart on the navy hero card (portfolio) — holding-chart behaviour, light-on-dark skin */
.heroCard .ch{--ch-grid:rgba(255,255,255,.12);--ch-ax:rgba(255,255,255,.62)}
.heroCard .ch:focus-visible .ch-plot{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.heroCard .ch-dot{box-shadow:0 0 0 2px #101C86}
.heroCard .ch-endv{color:#0B1678}
.heroCard .ch-x{border-color:rgba(255,255,255,.55)}
.heroCard .ch-tip{background:rgba(9,15,72,.94);color:#fff;border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.heroCard .ch-tip .th,.heroCard .ch-tip .tr span{color:rgba(255,255,255,.66)}
.heroCard .ch-lg{color:rgba(255,255,255,.82)}
.heroCard .ch-tb{color:rgba(255,255,255,.75)}
.heroCard .ch-tb:hover{background:rgba(255,255,255,.14);color:#fff}
/* donut */
.dnut{position:relative;flex:none}
.dnut svg{display:block;overflow:visible}
.dn-seg{cursor:pointer;outline:none;transition:opacity .15s,stroke-width .15s}
.dnut.hov .dn-seg{opacity:.3}.dnut.hov .dn-seg.on{opacity:1}
.dn-c,.dn-h{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;transition:opacity .15s}
.dn-h{opacity:0;align-content:center;gap:0}
.dn-h b{font-size:18px;font-weight:700}.dn-h span{font-size:11px;color:var(--mute);max-width:70%;line-height:1.2}
.dnut.hov .dn-c{opacity:0}.dnut.hov .dn-h{opacity:1}
.lgd .dot{width:10px;height:10px;border-radius:3px}
/* columns */
.cb-plot{position:relative;margin-right:46px}
.cb-g{position:absolute;left:0;right:0;border-top:1px solid var(--ch-grid)}
.cb-g:first-child{border-top-color:var(--ch-ax);border-top-width:1px;opacity:.9}
.cb-g span{position:absolute;right:-46px;width:42px;text-align:right;transform:translateY(-50%);font-size:10.5px;color:var(--ch-ax);font-variant-numeric:tabular-nums}
.cb-cols{position:absolute;inset:0;display:flex;align-items:flex-end}
.cb-c{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;outline:none;cursor:pointer;border-radius:6px}
.cb-c i{display:block;width:9px;border-radius:4px 4px 0 0;transition:filter .15s,opacity .15s}
.cb-c i.in{background:var(--c2)}.cb-c i.out{background:var(--c1)}
.cb-plot:hover .cb-c i{opacity:.45}.cb-plot .cb-c.on i{opacity:1;filter:brightness(1.08)}
.cb-c.on{background:color-mix(in srgb,var(--ch-grid) 70%,transparent)}
.scr:not(.still) .cb-c i{animation:cbGrow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
.scr:not(.still) .cb-c:nth-child(n) i{animation-delay:calc(var(--d,0) * 1ms)}
@keyframes cbGrow{from{transform:scaleY(0)}}
.cb-tip{top:0}
.cb-xl{padding-right:46px}
.cb-xl span{flex:1;text-align:center}
@media (prefers-reduced-motion:reduce){.scr:not(.still) .ch-svg,.scr:not(.still) .cb-c i{animation:none}}
</style>
</head>

function lineChart(sets,{w=340,h=160,pad=6,grid=true,labels=null}={}){
  const all=sets.flatMap(s=>s.d);let mn=Math.min(...all),mx=Math.max(...all);if(mx===mn){mx+=1;mn-=1}
  const rg=mx-mn;mn-=rg*.08;mx+=rg*.08;
  const X=(i,n)=>pad+i*(w-2*pad)/(n-1),Y=v=>h-pad-(v-mn)/(mx-mn)*(h-2*pad);
  let g='';if(grid)for(let i=1;i<4;i++)g+=`<line x1="0" x2="${w}" y1="${h*i/4}" y2="${h*i/4}" stroke="var(--line)" stroke-dasharray="3 4"/>`;
  const paths=sets.map((s,k)=>{const pts=s.d.map((v,i)=>`${X(i,s.d.length).toFixed(1)},${Y(v).toFixed(1)}`);const line='M'+pts.join('L');
    const fill=s.fill?`<path d="${line}L${X(s.d.length-1,s.d.length)},${h}L${X(0,s.d.length)},${h}Z" fill="url(#gf${k}${s.c.replace(/\W/g,'')})" />`:'';
    const grad=s.fill?`<defs><linearGradient id="gf${k}${s.c.replace(/\W/g,'')}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".22"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient></defs>`:'';
    return grad+fill+`<path d="${line}" fill="none" stroke="${s.c}" stroke-width="${s.wd||2.2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 5"':''}/>`}).join('');
  let lb='';if(labels)lb=`<div class="row sb t-xs mute mt4">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px">${g}${paths}</svg>${lb}`;
}
function donut(segs,size=150,th=20,center=''){
  const r=(size-th)/2,C=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s.v,0);let off=0;
  const arcs=segs.map(s=>{const L=s.v/tot*C;const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${th}" stroke-dasharray="${Math.max(L-2,0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=L;return el}).join('');
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}">${arcs}</svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">${center}</div></div>`;
}
function gauge(score,size=220){
  const r=size/2-16,cx=size/2,cy=size/2,C=Math.PI*r,L=score/100*C;
  const col=score>=75?'var(--green)':score>=55?'var(--amber)':'var(--red)';
  return `<svg width="${size}" height="${size/2+12}" viewBox="0 0 ${size} ${size/2+12}"><path d="M16 ${cy} A${r} ${r} 0 0 1 ${size-16} ${cy}" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/><path d="M16 ${cy} A${r} ${r} 0 0 1 ${size-16} ${cy}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${L} ${C}"/></svg>`;
}

function chatAPI(box,scroller){

 function row(html,wide){const last=box.lastElementChild;if(last&&last.classList.contains('botrow'))$('.av',last).classList.add('ghost');
   const r=document.createElement('div');r.className='botrow';r.innerHTML=`<div class="av"><img src="${LOGO_MARK}" alt=""></div><div class="msg bot ${wide?'wide':''}">${html}</div>`;box.appendChild(r);down();return r}
 return{alive,down,
  async bot(html,o={}){if(!alive())throw 'stop';const t=row('<div class="typing"><i></i><i></i><i></i></div>');$('.msg',t).style.padding='0';
    await sleep((o.wait??500)+Math.min(html.replace(/<[^>]+>/g,'').length*9,1100));if(!alive())throw 'stop';t.remove();return row(html,o.wide)},
  me(t){const m=document.createElement('div');m.className='msg me';m.textContent=t;box.appendChild(m);down()},
  ask(html,wire){if(!alive())throw 'stop';return new Promise(res=>{const el=document.createElement('div');el.className='reply';el.innerHTML=html;box.appendChild(el);down();wire(el,v=>{el.remove();res(v)})})},
  text(o){return this.ask(`${o.top||''}<div class="row" style="gap:8px"><input class="inp" placeholder="${o.ph}" ${o.max?`maxlength="${o.max}"`:''} ${o.mode?`inputmode="${o.mode}"`:''} autocomplete="off" style="${o.upper?'text-transform:uppercase;letter-spacing:.08em':''}"><button class="btn" style="width:52px;padding:0;flex:none" aria-label="Send">${ic('send')}</button></div><div class="err-t mt8" hidden></div>${o.hint?`<div class="t-xs mute mt8">${o.hint}</div>`:''}`,
    (el,done)=>{const i=$('input',el),b=$('button',el),e=$('.err-t',el);setTimeout(()=>i.focus(),100);const sub=()=>{let v=i.value.trim();if(o.upper)v=v.toUpperCase();const er=o.validate?o.validate(v):'';if(er){e.hidden=false;e.textContent=er;i.classList.add('err');return}done(v)};b.onclick=sub;i.onkeydown=k=>{if(k.key==='Enter')sub()};i.oninput=()=>{e.hidden=true;i.classList.remove('err')}})},

   $('#cgo',el).onclick=()=>startInvest([['pfc',t==='goal'?sipNeeded(C.target,C.y,C.r):t==='lump'?C.lump:C.sip]],t==='lump'?'lump':'sip')};

 if(/basket/.test(q)){await C.bot('Here are our curated baskets. Each is a ready-made portfolio for one goal.');await C.bot(BASKETS.slice(0,3).map(b=>`<button class="li" onclick="go('basket',{id:'${b.id}'})"><div class="pill-ic" style="background:${b.bg};color:#fff">${ic('basket')}</div><div class="grow"><b class="t-s">${b.n}</b><div class="t-xs mute">${b.goal}, 3Y ${b.r3}%</div></div></button>`).join(''),{wide:true,wait:0});return}
 if(/create|new goal/.test(q)){await C.bot('Let’s set it up. Pick the kind of goal, how much you need and by when.');newGoal();return}

 const arcs=segs.map((s,k)=>{const L=s.v/tot*C,pc=Math.round(s.v/tot*100);const el=`<circle class="dn-seg" data-k="${k}" data-l="${esc(s.l||'')}" data-p="${pc}%" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${cc(s.c)}" stroke-width="${th}" stroke-dasharray="${Math.max(L-2.5,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})" tabindex="0"><title>${esc(s.l||'')} ${pc}%</title></circle>`;off+=L;return el}).join('');
 return `<div class="dnut" id="${id}" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--tint)" stroke-width="${th}" opacity=".6"/>${arcs}</svg><div class="dn-c">${center}</div><div class="dn-h"></div></div>`}
const dnOn=e=>{const s=e.target.closest&&e.target.closest('.dn-seg');if(!s)return;const d=s.closest('.dnut');d.classList.add('hov');$$('.dn-seg',d).forEach(x=>x.classList.toggle('on',x===s));const h=$('.dn-h',d);h.textContent='';const b=document.createElement('b');b.textContent=s.dataset.p;const l=document.createElement('span');l.textContent=s.dataset.l;h.append(b,l)};
const dnOff=e=>{const d=e.target.closest&&e.target.closest('.dnut');if(d&&(!e.relatedTarget||!d.contains(e.relatedTarget))){d.classList.remove('hov');$$('.dn-seg',d).forEach(x=>x.classList.remove('on'))}};
document.addEventListener('pointerover',dnOn);document.addEventListener('focusin',dnOn);document.addEventListener('pointerout',dnOff);document.addEventListener('focusout',dnOff);

/* money in / out columns: 2 series, ≤10px columns, 4px rounded caps, hairline grid, hover per month */
function barsIO(){const h=150,mx=Math.max(...BANK.inF,...BANK.out),tk=niceTicks(0,mx,3),hi=tk[tk.length-1],n=BANK.m.length;
 const col=(v,cls,k)=>`<i class="${cls}" style="height:${(v/hi*100).toFixed(2)}%"></i>`;
 return `<div class="cb"><div class="cb-plot" style="height:${h}px">${tk.map(t=>`<div class="cb-g" style="bottom:${t/hi*100}%"><span>${fCompact(t)}</span></div>`).join('')}
 <div class="cb-cols">${BANK.m.map((m,i)=>`<div class="cb-c" tabindex="0" data-m="${m}" data-in="${inr(BANK.inF[i])}" data-out="${inr(BANK.out[i])}" aria-label="${m}: in ${inr(BANK.inF[i])}, out ${inr(BANK.out[i])}">${col(BANK.inF[i],'in')}${col(BANK.out[i],'out')}</div>`).join('')}</div><div class="ch-tip cb-tip"></div></div>
 <div class="cb-xl">${BANK.m.map((m,i)=>`<span>${i%2?'':m}</span>`).join('')}</div>
 <div class="ch-lg"><span><i class="bar" style="--c:var(--c2)"></i>Money in</span><span><i class="bar" style="--c:var(--c1)"></i>Money out</span></div></div>`}
const cbOn=e=>{const c=e.target.closest&&e.target.closest('.cb-c');if(!c)return;const p=c.closest('.cb-plot'),t=$('.cb-tip',p);$$('.cb-c',p).forEach(x=>x.classList.toggle('on',x===c));t.textContent='';
 const hd=document.createElement('div');hd.className='th';hd.textContent=c.dataset.m+' 2026'.replace(/ 2026/,MON.indexOf(c.dataset.m)>=10?' 2025':' 2026');t.appendChild(hd);
 [['in','var(--c2)','Money in'],['out','var(--c1)','Money out']].forEach(([k,col,l])=>{const r=document.createElement('div');r.className='tr';const i=document.createElement('i');i.className='bar';i.style.setProperty('--c',col);const b=document.createElement('b');b.textContent=c.dataset[k];const s=document.createElement('span');s.textContent=l;r.append(i,b,s);t.appendChild(r)});
 t.style.display='block';const pr=p.getBoundingClientRect(),cr=c.getBoundingClientRect(),x=cr.left-pr.left+cr.width/2,tw=t.offsetWidth;t.style.left=Math.min(Math.max(x-tw/2,0),pr.width-tw-40)+'px'};
const cbOff=e=>{const p=e.target.closest&&e.target.closest('.cb-plot');if(p&&(!e.relatedTarget||!p.contains(e.relatedTarget))){$('.cb-tip',p).style.display='none';$$('.cb-c',p).forEach(x=>x.classList.remove('on'))}};
document.addEventListener('pointerover',cbOn);document.addEventListener('focusin',cbOn);document.addEventListener('pointerout',cbOff);document.addEventListener('focusout',cbOff);

/* gauge + ring refinements */
function gauge(score,size=220){const r=size/2-14,cy=size/2,C=Math.PI*r,L=score/100*C;const col=score>=75?'var(--green)':score>=55?'var(--amber)':'var(--red)';
 const tick=v=>{const a=Math.PI*(1-v/100),x1=size/2+Math.cos(a)*(r-14),y1=cy-Math.sin(a)*(r-14),x2=size/2+Math.cos(a)*(r-20),y2=cy-Math.sin(a)*(r-20);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>`};
 return `<svg width="${size}" height="${size/2+12}" viewBox="0 0 ${size} ${size/2+12}" role="img" aria-label="Score ${score} out of 100"><path d="M14 ${cy} A${r} ${r} 0 0 1 ${size-14} ${cy}" fill="none" stroke="currentColor" stroke-opacity=".16" stroke-width="12" stroke-linecap="round"/><path d="M14 ${cy} A${r} ${r} 0 0 1 ${size-14} ${cy}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L} ${C}"/>${[0,25,50,75,100].map(tick).join('')}</svg>`}
function ring(pc,size=56,c='var(--c1)'){const th=size>=70?6:5,r=size/2-th/2-1,C=2*Math.PI*r;c=c==='var(--brand)'?'var(--c1)':c;return `<svg width="${size}" height="${size}" role="img" aria-label="${Math.round(pc)}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--tint)" stroke-width="${th}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${th}" stroke-linecap="round" stroke-dasharray="${C*Math.min(pc,100)/100} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function legend(items){return `<div class="col gap8 lgd">${items.map(i=>`<div class="row t-s"><span class="dot" style="background:${cc(i.c)}"></span><span class="grow ink2 ell">${i.l}</span><b class="num">${i.v}</b></div>`).join('')}</div>`}

/* ============ init ============ */
buildMap();go('splash');
</script>
